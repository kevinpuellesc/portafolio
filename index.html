<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Puelles | Fotógrafo Documental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html { scroll-behavior: smooth; }
        .img-reveal img {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .img-reveal:hover img {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="bg-white text-zinc-900 font-light">

    <nav class="fixed w-full z-50 mix-blend-difference text-white px-6 md:px-12 py-8 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tighter uppercase">Kevin Puelles</h1>
        <div class="space-x-8 text-[10px] uppercase tracking-[0.3em] font-bold">
            <a href="sobre-mi.html" class="hover:opacity-60 transition">Sobre mí</a>
            <a href="#proyectos" class="hover:opacity-60 transition">Proyectos</a>
            <a href="#contacto" class="hover:opacity-60 transition">Contacto</a>
        </div>
    </nav>

    <main id="inicio" class="bg-white">
        
        <section class="w-full h-screen overflow-hidden img-reveal">
            <img src="img/portfolio-018.jpg" alt="Kevin Puelles - Imagen Principal" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000">
        </section>

        <section class="max-w-[1600px] mx-auto py-4 px-4 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="h-[70vh] overflow-hidden img-reveal">
                <img src="img/portfolio-007.jpg" class="w-full h-full object-cover">
            </div>
            <div class="h-[70vh] overflow-hidden img-reveal">
                <img src="img/portfolio-010.jpg" class="w-full h-full object-cover">
            </div>
        </section>

        <section class="max-w-[1600px] mx-auto pb-24 px-4 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="aspect-square md:aspect-[4/5] overflow-hidden img-reveal">
                <img src="img/portfolio-011.jpg" class="w-full h-full object-cover">
            </div>
            <div class="aspect-square md:aspect-[4/5] overflow-hidden img-reveal">
                <img src="img/portfolio-001.jpg" class="w-full h-auto md:h-full object-cover">
            </div>
            <div class="aspect-square md:aspect-[4/5] overflow-hidden img-reveal">
                <img src="img/portfolio-013.jpg" class="w-full h-full object-cover">
            </div>
        </section>
    </main>

    <section id="proyectos" class="py-32 px-6 bg-zinc-50">
        <div class="max-w-6xl mx-auto">
            <span class="text-zinc-400 uppercase tracking-[0.3em] text-[10px] font-bold mb-12 block">Portafolio Seleccionado</span>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-24">
                <a href="fotos-de-lucha.html" class="group block">
                    <div class="aspect-[16/10] overflow-hidden bg-zinc-200 mb-8">
                        <img src="img/portfolio-018.jpg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                    </div>
                    <h3 class="text-3xl font-light italic mb-2 transition-colors group-hover:text-orange-600">FotosDeLucha</h3>
                    <p class="text-zinc-500 text-sm max-w-md">Investigación visual y registro autogestionado del proceso popular peruano.</p>
                </a>

                <div class="opacity-20 cursor-default">
                    <div class="aspect-[16/10] bg-zinc-200 mb-8 flex items-center justify-center italic text-zinc-400">Próximamente</div>
                    <h3 class="text-3xl font-light italic mb-2">Proyecto en preparación</h3>
                </div>
            </div>
        </div>
    </section>

    <footer id="contacto" class="py-32 bg-white text-center px-6 border-t border-zinc-100">
        <h2 class="text-4xl font-light mb-12 tracking-tight">Hablemos</h2>
        <div class="flex flex-col md:flex-row justify-center items-center gap-8 md:gap-16 text-[10px] uppercase tracking-[0.3em] font-bold text-zinc-400">
            <a href="https://www.instagram.com/fotosdelucha.pe/" target="_blank" class="hover:text-black flex items-center gap-2">
                <i data-lucide="instagram" class="w-4 h-4"></i> Instagram
            </a>
            <a href="https://wa.me/TU_NUMERO" target="_blank" class="hover:text-black flex items-center gap-2">
                <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
            </a>
            <a href="mailto:tu_correo@ejemplo.com" class="hover:text-black flex items-center gap-2">
                <i data-lucide="mail" class="w-4 h-4"></i> Email
            </a>
        </div>
        <p class="mt-20 text-[9px] tracking-[0.5em] text-zinc-300 uppercase">© 2026 Kevin Puelles — Fotografía Documental</p>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
