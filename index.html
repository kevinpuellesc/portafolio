<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 400px;
            gap: 10px;
            padding: 10px;
        }
        .home-grid div { overflow: hidden; position: relative; }
        .home-grid img { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(100%); transition: all 0.7s ease;
        }
        .home-grid div:hover img { filter: grayscale(0%); transform: scale(1.05); }
    </style>
</head>
<body class="bg-white text-zinc-900 font-light">

            <a href="sobre-mi.html" class="hover:opacity-50 transition">Sobre mí</a>
            <a href="#portafolio" class="hover:opacity-50 transition">Portafolio</a>

                <div class="aspect-[16/10] overflow-hidden bg-zinc-100 mb-6">
                    <img src="img/portfolio-018.jpg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
