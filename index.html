<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Puelles | Fotografía Documental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Grid de extremo a extremo sin recortes */
        .masonry-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @media (min-width: 768px) {
            .masonry-grid {
                display: block;
                column-count: 2;
                column-gap: 10px;
                padding: 0 10px;
            }
            .grid-item {
                break-inside: avoid;
                margin-bottom: 10px;
                display: block;
            }
        }
        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.5s ease;
        }
        .grid-item:hover img { opacity: 0.9; }

        /* Navegación adaptable */
        #mobile-menu { display: none; }
        #mobile-menu.active { display: flex; }
    </style>
</head>
<body class="bg-white text-zinc-900">

    <nav class="fixed w-full z-50 bg-white/95 border-b border-zinc-100 px-6 py-5">
        <div class="max-w-[1800px] mx-auto flex justify-between items-center">
            <a href="index.html" class="text-lg font-semibold tracking-tighter uppercase text-black">Kevin Puelles</a>
            
            <div class="hidden md:flex space-x-10 text-[11px] uppercase tracking-[0.2em] font-medium text-zinc-500">
                <a href="sobre-mi.html" class="hover:text-black transition">Sobre mí</a>
                <a href="#proyectos" class="hover:text-black transition">Proyectos</a>
                <a href="#contacto" class="hover:text-black transition">Contacto</a>
            </div>

            <button class="md:hidden text-black" onclick="toggleMenu()">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>
    </nav>

    <div id="mobile-menu" class="fixed inset-0 bg-white z-[60] flex-col items-center justify-center space-y-8 text-xl uppercase tracking-widest hidden">
        <button class="absolute top-6 right-6" onclick="toggleMenu()"><i data-lucide="x"></i></button>
        <a href="sobre-mi.html" onclick="toggleMenu()">Sobre mí</a>
        <a href="#proyectos" onclick="toggleMenu()">Proyectos</a>
        <a href="#contacto" onclick="toggleMenu()">Contacto</a>
    </div>

    <main class="pt-24 pb-10">
        <div class="masonry-grid w-full">
            <div class="grid-item md:col-span-2">
                <img src="img/portfolio-018.jpg" alt="Kevin Puelles">
            </div>
            
            <div class="grid-item"><img src="img/portfolio-003.webp"></div>
            <div class="grid-item"><img src="img/portfolio-020.webp"></div>
            <div class="grid-item"><img src="img/portfolio-005.webp"></div>
            <div class="grid-item"><img src="img/portfolio-007.webp"></div>
            <div class="grid-item"><img src="img/portfolio-008.webp"></div>
            <div class="grid-item"><img src="img/portfolio-011.webp"></div>
            <div class="grid-item"><img src="img/portfolio-012.webp"></div>
            <div class="grid-item"><img src="img/portfolio-021.webp"></div>
            <div class="grid-item"><img src="img/portfolio-014.webp"></div>
            <div class="grid-item"><img src="img/portfolio-016.webp"></div>
            <div class="grid-item"><img src="img/portfolio-022.webp"></div>
            <div class="grid-item"><img src="img/portfolio-017.webp"></div>
            <div class="grid-item"><img src="img/portfolio-023.webp"></div>
        </div>
    </main>

    <section id="proyectos" class="py-32 px-6 bg-zinc-50 border-t border-zinc-100">
        <div class="max-w-6xl mx-auto text-center">
            <span class="text-zinc-400 uppercase tracking-[0.3em] text-[10px] font-bold mb-12 block">Portafolio Seleccionado</span>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <a href="fotos-de-lucha.html" class="group block text-left">
                    <div class="aspect-[16/10] overflow-hidden bg-zinc-200 mb-6">
                        <img src="img/portfolio-018.jpg" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                    </div>
                    <h3 class="text-2xl font-normal text-black">FotosDeLucha</h3>
                    <p class="text-zinc-500 text-sm mt-2 font-light">Investigación visual del proceso popular peruano.</p>
                </a>
                <div class="text-left opacity-30">
                    <div class="aspect-[16/10] bg-zinc-200 mb-6 flex items-center justify-center italic text-zinc-400">Próximamente</div>
                    <h3 class="text-2xl font-normal text-zinc-400">Próximo proyecto</h3>
                </div>
            </div>
        </div>
    </section>

    <footer id="contacto" class="py-32 bg-white text-center px-6">
        <h2 class="text-3xl font-light mb-12 text-black">Hablemos</h2>
        <div class="flex flex-wrap justify-center gap-8 md:gap-16 text-[10px] uppercase tracking-[0.3em] font-bold text-zinc-400">
            <a href="https://www.instagram.com/fotosdelucha.pe/" target="_blank" class="hover:text-black flex items-center gap-2 transition">
                <i data-lucide="instagram" class="w-4 h-4"></i> Instagram
            </a>
            <a href="https://wa.me/TU_NUMERO" target="_blank" class="hover:text-black flex items-center gap-2 transition">
                <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
            </a>
        </div>
        <p class="mt-20 text-[9px] tracking-[0.5em] text-zinc-300 uppercase">© 2026 Kevin Puelles</p>
    </footer>

    <script>
        lucide.createIcons();
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('active');
        }
    </script>
</body>
</html>
