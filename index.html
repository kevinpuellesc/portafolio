<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Puelles | Fotografía Documental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-roboto-black { font-family: 'Roboto', sans-serif; font-weight: 900; }
        
        .masonry-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            padding: 0 10px;
        }
        @media (min-width: 768px) {
            .masonry-grid {
                display: block;
                column-count: 2;
                column-gap: 10px;
            }
            .grid-item {
                break-inside: avoid;
                margin-bottom: 10px;
                display: block;
                position: relative; /* Necesario para el texto montado */
            }
        }
        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Capa de texto sobre imagen */
        .overlay-text {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 60%);
            display: flex;
            align-items: flex-end;
            padding: 30px;
            color: white;
            pointer-events: none; /* Permite clics a través del texto si fuera necesario */
        }

        #mobile-menu { display: none; }
        #mobile-menu.active { display: flex; }
    </style>
</head>
<body class="bg-white text-zinc-900">

    <nav class="fixed w-full z-50 bg-white/95 border-b border-zinc-100 px-6 py-5">
        <div class="max-w-[1800px] mx-auto flex justify-between items-center">
            <a href="index.html" class="text-lg font-semibold tracking-tighter uppercase text-black">Kevin Puelles</a>
            <div class="hidden md:flex space-x-10 text-[11px] uppercase tracking-[0.2em] font-medium text-zinc-500">
                <a href="sobre-mi.html" class="hover:text-black transition">Sobre mí</a>
                <a href="contacto.html" class="hover:text-black transition">Contacto</a>
            </div>
            <button class="md:hidden text-black" onclick="toggleMenu()">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>
    </nav>

    <div id="mobile-menu" class="fixed inset-0 bg-white z-[60] flex-col items-center justify-center space-y-8 text-xl uppercase tracking-widest hidden">
        <button class="absolute top-6 right-6" onclick="toggleMenu()"><i data-lucide="x"></i></button>
        <a href="index.html" onclick="toggleMenu()">Inicio</a>
        <a href="sobre-mi.html" onclick="toggleMenu()">Sobre mí</a>
        <a href="contacto.html" onclick="toggleMenu()">Contacto</a>
    </div>

    <main class="pt-24 pb-10">
        <div id="photo-grid" class="masonry-grid">
            </div>
    </main>

    <footer class="py-24 text-center px-6 border-t border-zinc-50">
        <div class="flex flex-col items-center gap-8">
            <a href="contacto.html" class="group inline-flex items-center gap-4 text-[11px] uppercase tracking-[0.3em] font-bold text-black border border-black px-12 py-4 hover:bg-black hover:text-white transition-all duration-500">
                Trabajemos juntos
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
            <p class="mt-12 text-[9px] tracking-[0.5em] text-zinc-300 uppercase">© 2026 Kevin Puelles — Mirar con respeto, narrar con transparencia.</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('active');
        }

        const images = [
            "img/portfolio-018.jpg", "img/portfolio-003.webp", "img/portfolio-020.webp",
            "img/portfolio-005.webp", "img/portfolio-007.webp", "img/portfolio-008.webp",
            "img/portfolio-011.webp", "img/portfolio-012.webp", "img/portfolio-021.webp",
            "img/portfolio-014.webp", "img/portfolio-016.webp", "img/portfolio-022.webp",
            "img/portfolio-017.webp", "img/portfolio-023.webp", "img/portfolio-001C.webp",
            "img/portfolio-002C.webp", "img/portfolio-003C.webp", "img/portfolio-004C.webp",
            "img/portfolio-005C.webp", "img/portfolio-001cc.webp", "img/portfolio-002cc.webp"
        ];

        const phrases = [
            "Más que un registro, es una relación entre la cámara y el entorno.",
            "De las ideas a las imágenes.",
            "La fotografía es el retrato del tiempo."
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let shuffledImages = shuffle([...images]);
        let shuffledPhrases = shuffle([...phrases]);

        const grid = document.getElementById('photo-grid');
        
        // Asignamos frases a posiciones específicas para cumplir tu regla
        // Una frase en las primeras 4, el resto después.
        let phrasePositions = [
            Math.floor(Math.random() * 4), 
            8 + Math.floor(Math.random() * 4),
            15 + Math.floor(Math.random() * 4)
        ];

        shuffledImages.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'grid-item';
            
            let html = `<img src="${src}" alt="Kevin Puelles Fotografía">`;
            
            // Si el índice coincide con una posición de frase, la montamos encima
            if (phrasePositions.includes(index) && shuffledPhrases.length > 0) {
                const text = shuffledPhrases.pop();
                html += `
                    <div class="overlay-text">
                        <p class="font-roboto-black text-2xl md:text-3xl uppercase leading-none tracking-tighter">
                            ${text}
                        </p>
                    </div>`;
            }
            
            div.innerHTML = html;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
